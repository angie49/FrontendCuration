name: Curate

on:
  schedule:
    # 毎日 JST 8:00（UTC 23:00）に実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動実行用
  push:
    branches: [main]
    paths:
      - 'sources.json'
      - 'scripts/**'
      - '.github/workflows/curate.yml'

permissions:
  contents: write # data/archive.json をコミットするため
  pages: write
  id-token: write

concurrency:
  group: curate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --omit=dev

      - name: フィード収集とHTML生成
        env:
          # AI要約を使う場合のみ設定（未設定ならフィードそのままで動作）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run build

      - name: アーカイブをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update archive ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
